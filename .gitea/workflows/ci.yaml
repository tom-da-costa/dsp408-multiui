name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        env:
          UV_VERSION: "0.13.0"
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing

  e2e:
    # dsp408-sim and dsp408-multiui started side by side as two programs; the app reaches the
    # simulated DSP over TCP like a real one (tests/e2e/test_stack.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        env:
          UV_VERSION: "0.13.0"
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --locked

      - name: Simulator + app end to end
        env:
          DSP408_E2E_LOG_DIR: e2e-logs
        run: uv run pytest -m e2e -v

  web:
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Type check
        working-directory: web
        run: npm run check

      - name: Unit tests
        working-directory: web
        run: npm test

      - name: The committed build is up to date
        run: |
          cd web && npm run build && cd ..
          git config --global --add safe.directory "$PWD"
          if [ -n "$(git status --porcelain -- src/dsp408_multiui/web)" ]; then
            git status --short -- src/dsp408_multiui/web
            echo "::error::src/dsp408_multiui/web is stale: run 'make web' and commit the result"
            exit 1
          fi
