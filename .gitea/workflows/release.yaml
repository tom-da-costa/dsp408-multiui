# Releases (docs/release.md):
# - push to main  -> pre-release "main" (tag main-latest), rebuilt on every push, image :main
# - tag vX.Y.Z    -> release vX.Y.Z, image :X.Y.Z and :latest
# Each release holds the standalone executables of the app and of the dsp408-sim simulator.
# Optional parts, skipped with a warning when the runner or the repository lacks them:
# - linux-arm64 executables and the arm64 image need QEMU binfmt on the runner host;
# - the Docker image needs a REGISTRY_TOKEN secret (a token with package write access; the
#   automatic Actions token cannot push packages) and uses the REGISTRY variable as host.
name: Release

on:
  push:
    branches: [main, release-main]  # TEMP: release-main for the first test run
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GITEA_URL: ${{ github.server_url }}
  GITEA_REPO: ${{ github.repository }}
  GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $VERSION"; exit 1
          fi

      - name: Install uv
        env:
          UV_VERSION: "0.13.0"
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Tests (nothing is published from a failing commit)
        run: |
          uv sync --locked
          uv run pytest -q
          uv run pytest -q -m e2e

      - name: Create the release
        run: packaging/release.sh prepare

  exe-linux:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Build in a ${{ matrix.arch }} container
        run: |
          eval "$(packaging/release.sh env)"
          if ! docker run --rm --platform "linux/${{ matrix.arch }}" busybox true 2>/dev/null; then
            echo "::warning::no QEMU binfmt for ${{ matrix.arch }} on the runner host: skipped (docs/release.md)"
            exit 0
          fi
          # buildx sends the build context, so this also works when the job container talks to
          # the host's Docker daemon (a bind mount of $PWD would point at the wrong path).
          docker buildx build --platform "linux/${{ matrix.arch }}" \
            --build-arg "NAME=dsp408-multiui-${ASSET_VERSION}-linux-${{ matrix.arch }}" \
            -f packaging/exe.Dockerfile -o dist .
      - name: Upload to the release
        run: |
          set -- dist/dsp408-*-linux-${{ matrix.arch }}
          [ -e "$1" ] || exit 0
          packaging/release.sh upload "$@"

  exe-windows:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cross-build with Wine
        run: |
          eval "$(packaging/release.sh env)"
          docker buildx build --build-arg "NAME=dsp408-multiui-${ASSET_VERSION}-windows-amd64" \
            -f packaging/windows.Dockerfile -o dist .
      - name: Upload to the release
        run: packaging/release.sh upload dist/dsp408-*-windows-amd64.exe

  docker:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and push the image
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY: ${{ vars.REGISTRY }}
        run: |
          if [ -z "$REGISTRY_TOKEN" ]; then
            echo "::warning::no REGISTRY_TOKEN secret: Docker image not published (docs/release.md)"
            exit 0
          fi
          eval "$(packaging/release.sh env)"
          REGISTRY="${REGISTRY:-$(echo "$GITEA_URL" | sed -E 's#^https?://##; s#/.*$##')}"
          IMAGE="$REGISTRY/$(echo "$GITEA_REPO" | tr '[:upper:]' '[:lower:]')"
          PLATFORMS="linux/amd64"
          if docker run --rm --platform linux/arm64 busybox true 2>/dev/null; then
            PLATFORMS="$PLATFORMS,linux/arm64"
          else
            echo "::warning::no QEMU binfmt for arm64 on the runner host: amd64 image only"
          fi
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          docker buildx create --use --name dsp408 2>/dev/null || docker buildx use dsp408
          TAGS=""
          for T in $IMAGE_TAGS; do TAGS="$TAGS -t $IMAGE:$T"; done
          # shellcheck disable=SC2086
          docker buildx build --platform "$PLATFORMS" $TAGS --push .
