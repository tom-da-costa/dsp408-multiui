# Test bench without a DSP: the web app connected over TCP to a separate simulated DSP 408.
#   docker compose -f compose.sim.yaml up -d   then open http://localhost:8080 (code 0000)
#   docker attach tracks-dsp-sim               simulator console (type help; detach: Ctrl-P Ctrl-Q)
# The simulator keeps stored presets in the tracks-dsp-sim-state volume. Its port 9761 is also
# published, so probe, a second app instance or the official editor can connect to it.
services:
  tracks-dsp-sim:
    image: ${TDSP_IMAGE:-tracks-dsp-controller:latest}
    build: .
    container_name: tracks-dsp-sim
    command: ["sim", "--state-dir", "/app/state"]
    stdin_open: true   # with tty: `docker attach tracks-dsp-sim` opens the console
    tty: true
    healthcheck:
      disable: true    # a TCP probe would be one more DSP client
    ports:
      - "${TDSP_SIM_PORT:-9761}:9761"
    volumes:
      - tracks-dsp-sim-state:/app/state
    environment:
      TDSP_SIM_SCENARIO: ${TDSP_SIM_SCENARIO:-demo}
      TDSP_SIM_FAST: ${TDSP_SIM_FAST:-false}
      TDSP_SIM_SECOND_CLIENT: ${TDSP_SIM_SECOND_CLIENT:-queue}
      TDSP_SIM_LOG_LEVEL: ${TDSP_LOG_LEVEL:-info}

  dsp408:
    image: ${TDSP_IMAGE:-tracks-dsp-controller:latest}
    build: .
    container_name: tracks-dsp-controller-sim
    depends_on: [tracks-dsp-sim]
    ports:
      - "${TDSP_LISTEN_PORT:-8080}:8080"
    environment:
      TDSP_HOST: tracks-dsp-sim
      TDSP_PIN: ${TDSP_PIN:-0000}
      TDSP_LOG_LEVEL: ${TDSP_LOG_LEVEL:-info}

volumes:
  tracks-dsp-sim-state:
