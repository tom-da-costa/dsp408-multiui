# docker compose up -d   (settings come from .env, see .env.example)
services:
  dsp408:
    image: ${TDSP_IMAGE:-tracks-dsp-controller:latest}
    build: .
    container_name: tracks-dsp-controller
    # on-failure: a crash restarts it, "Disconnect from DSP and shutdown" (exit 0) keeps it stopped
    restart: on-failure
    ports:
      - "${TDSP_LISTEN_PORT:-8080}:8080"
    environment:
      TDSP_HOST: ${TDSP_HOST:-}
      TDSP_PORT: ${TDSP_PORT:-9761}
      TDSP_PIN: ${TDSP_PIN:-0000}
      TDSP_METER_RATE: ${TDSP_METER_RATE:-5}
      TDSP_LOCK_IDLE_TIMEOUT: ${TDSP_LOCK_IDLE_TIMEOUT:-120}
      TDSP_RESYNC_INTERVAL: ${TDSP_RESYNC_INTERVAL:-0}
      TDSP_EXPERIMENTAL: ${TDSP_EXPERIMENTAL:-false}
      TDSP_DEMO: ${TDSP_DEMO:-false}
      TDSP_MODEL: ${TDSP_MODEL:-auto}
      TDSP_DEVICE_ID: ${TDSP_DEVICE_ID:-}
      TDSP_LOG_LEVEL: ${TDSP_LOG_LEVEL:-info}
      # HTTPS: a self-signed certificate (kept in the tls volume), or your own (mount it)
      TDSP_TLS_SELF_SIGNED: ${TDSP_TLS_SELF_SIGNED:-false}
      TDSP_TLS_CERT: ${TDSP_TLS_CERT:-}
      TDSP_TLS_KEY: ${TDSP_TLS_KEY:-}
      TDSP_TLS_NAMES: ${TDSP_TLS_NAMES:-}    # e.g. 192.168.1.10,dsp.local: this host's address
    volumes:
      - tracks-dsp-tls:/app/tls
      # your own certificate: mount it and set TDSP_TLS_CERT / TDSP_TLS_KEY to these paths
      # - ./certs:/certs:ro

volumes:
  tracks-dsp-tls:
