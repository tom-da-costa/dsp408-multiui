# docker compose up -d   (settings come from .env, see .env.example)
services:
  dsp408:
    image: ${DSP408_IMAGE:-tracks-dsp-controller:latest}
    build: .
    container_name: tracks-dsp-controller
    restart: unless-stopped
    ports:
      - "${DSP408_LISTEN_PORT:-8080}:8080"
    environment:
      DSP408_HOST: ${DSP408_HOST:-}
      DSP408_PORT: ${DSP408_PORT:-9761}
      DSP408_PIN: ${DSP408_PIN:-0000}
      DSP408_METER_RATE: ${DSP408_METER_RATE:-5}
      DSP408_LOCK_IDLE_TIMEOUT: ${DSP408_LOCK_IDLE_TIMEOUT:-120}
      DSP408_RESYNC_INTERVAL: ${DSP408_RESYNC_INTERVAL:-0}
      DSP408_EXPERIMENTAL: ${DSP408_EXPERIMENTAL:-false}
      DSP408_DEMO: ${DSP408_DEMO:-false}
      DSP408_MODEL: ${DSP408_MODEL:-auto}
      DSP408_LOG_LEVEL: ${DSP408_LOG_LEVEL:-info}
      # HTTPS: a self-signed certificate (kept in the tls volume), or your own (mount it)
      DSP408_TLS_SELF_SIGNED: ${DSP408_TLS_SELF_SIGNED:-false}
      DSP408_TLS_CERT: ${DSP408_TLS_CERT:-}
      DSP408_TLS_KEY: ${DSP408_TLS_KEY:-}
      DSP408_TLS_NAMES: ${DSP408_TLS_NAMES:-}    # e.g. 192.168.1.10,dsp.local: this host's address
    volumes:
      - tracks-dsp-tls:/app/tls
      # your own certificate: mount it and set DSP408_TLS_CERT / DSP408_TLS_KEY to these paths
      # - ./certs:/certs:ro

volumes:
  tracks-dsp-tls:
