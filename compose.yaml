# docker compose up -d   (settings come from .env, see .env.example)
# Each ${TDSP_X:-${DSP408_X:-…}} also accepts the DSP408_* names of versions before 0.8.
services:
  dsp408:
    image: ${TDSP_IMAGE:-${DSP408_IMAGE:-tracks-dsp-controller:latest}}
    build: .
    container_name: tracks-dsp-controller
    # on-failure: a crash restarts it, "Disconnect from DSP and shutdown" (exit 0) keeps it stopped
    restart: on-failure
    ports:
      - "${TDSP_LISTEN_PORT:-${DSP408_LISTEN_PORT:-8080}}:8080"
    environment:
      TDSP_HOST: ${TDSP_HOST:-${DSP408_HOST:-}}
      TDSP_PORT: ${TDSP_PORT:-${DSP408_PORT:-9761}}
      TDSP_PIN: ${TDSP_PIN:-${DSP408_PIN:-0000}}
      TDSP_METER_RATE: ${TDSP_METER_RATE:-${DSP408_METER_RATE:-5}}
      TDSP_LOCK_IDLE_TIMEOUT: ${TDSP_LOCK_IDLE_TIMEOUT:-${DSP408_LOCK_IDLE_TIMEOUT:-120}}
      TDSP_RESYNC_INTERVAL: ${TDSP_RESYNC_INTERVAL:-${DSP408_RESYNC_INTERVAL:-0}}
      TDSP_EXPERIMENTAL: ${TDSP_EXPERIMENTAL:-${DSP408_EXPERIMENTAL:-false}}
      TDSP_DEMO: ${TDSP_DEMO:-${DSP408_DEMO:-false}}
      TDSP_MODEL: ${TDSP_MODEL:-${DSP408_MODEL:-auto}}
      TDSP_DEVICE_ID: ${TDSP_DEVICE_ID:-${DSP408_DEVICE_ID:-}}
      TDSP_LOG_LEVEL: ${TDSP_LOG_LEVEL:-${DSP408_LOG_LEVEL:-info}}
      # HTTPS: a self-signed certificate (kept in the tls volume), or your own (mount it)
      TDSP_TLS_SELF_SIGNED: ${TDSP_TLS_SELF_SIGNED:-${DSP408_TLS_SELF_SIGNED:-false}}
      TDSP_TLS_CERT: ${TDSP_TLS_CERT:-${DSP408_TLS_CERT:-}}
      TDSP_TLS_KEY: ${TDSP_TLS_KEY:-${DSP408_TLS_KEY:-}}
      TDSP_TLS_NAMES: ${TDSP_TLS_NAMES:-${DSP408_TLS_NAMES:-}}    # e.g. 192.168.1.10,dsp.local: this host's address
    volumes:
      - tracks-dsp-tls:/app/tls
      # your own certificate: mount it and set TDSP_TLS_CERT / TDSP_TLS_KEY to these paths
      # - ./certs:/certs:ro

volumes:
  tracks-dsp-tls:
