name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing

  e2e:
    # the simulator (sim) and the app started side by side as two processes; the app reaches the
    # simulated DSP over TCP like a real one (tests/e2e/test_stack.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Simulator + app end to end
        env:
          TDSP_E2E_LOG_DIR: e2e-logs
        run: uv run pytest -m e2e -v

      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e-logs
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: The committed build is up to date
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- ../src/tracks_dsp_controller/web)" ]; then
            git status --short -- ../src/tracks_dsp_controller/web
            echo "::error::src/tracks_dsp_controller/web is stale: run 'make web' and commit the result"
            exit 1
          fi
