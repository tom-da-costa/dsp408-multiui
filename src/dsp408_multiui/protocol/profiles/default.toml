# Default protocol profile for the t.racks DSP 408.
#
# Every value that is not verified on a DSP 408 lives here (docs/SPEC.md §4.6). The comments give
# the confidence tag from docs/PROTOCOL.md: 408 = seen on a DSP 408, SIB = sibling model only,
# CONFLICT = sources disagree (the chosen value is the ▶ choice), HYP = our own hypothesis.
# Override with `--profile my.toml`: any subset of keys, same sections.

name = "dsp408-default"

[frame]
host_dst = 0x01            # 408 (t.racks-DSP-control claims 0x02 on the 206)

[topology]
input_count = 4            # 408
output_count = 8           # 408
preset_count = 20          # 408: U01..U20, plus F00 at slot 0
peq_bands_input = 8        # 408 (config blob)
peq_bands_output = 9       # 408 (config blob)
geq_bands = 31             # 408

[config]
page_count = 29            # 408
page_size = 50             # 408
last_page_size = 48        # 408

[codecs]
freq_steps = 300           # CONFLICT -> 300, confirmed by the 408 config blob
freq_min_hz = 19.70
freq_max_hz = 20160.0
q_steps = 100              # CONFLICT -> 100 (206 + 4x4 Mini agree)
q_min = 0.4
q_max = 128.0
delay_sample_rate_hz = 96000   # CONFLICT -> 96 kHz (206, same TCP generation); 4x4 Mini uses 48 kHz
delay_max_ms = 680.0           # SIB
compressor_layout = "wide"     # CONFLICT -> 206 layout, matches the 408 config blob
peq_types = ["Peak", "Low Shelf", "High Shelf", "LP -6dB", "LP -12dB", "HP -6dB", "HP -12dB",
             "Allpass 1", "Allpass 2"]    # SIB (206) / dsp-408-ui
slopes = ["Off", "BW-6", "BL-6", "BW-12", "BL-12", "LR-12", "BW-18", "BL-18", "BW-24", "BL-24",
          "LR-24", "BW-30", "BL-30", "BW-36", "BL-36", "LR-36", "BW-42", "BL-42", "BW-48",
          "BL-48", "LR-48"]               # SIB (206); index = raw value, 0 = bypass

[meters]
format = "float16"         # CONFLICT -> float16 (dsp-408-ui on a 408), alternative "level24"
tail_length = 2            # 408 (LEN = 0x27)
tail_limit_byte = 0        # HYP: per-output limiter-active bitmask
tail_clip_byte = 1         # HYP: "an input clips" flag
# tail_comp_byte is unset: no known per-output compressor-active field yet
reference = 1.0            # decoded linear value shown as 0 dB
clip_db = 6.0              # HYP: dsp-408-ui saw a maximum around 2.0 linear
floor_db = -90.0

[timing]
command_timeout_s = 0.5
slow_command_timeout_s = 3.0   # preset recall / store
